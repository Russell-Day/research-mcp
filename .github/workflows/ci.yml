name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The server drives Word through COM, so tests run on Windows. Word itself is not installed on
    # GitHub runners: the default suite needs neither Word nor Zotero.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not private_data"
      # One command per step, so any failing command fails the job.
      - name: research-mcp --version
        run: uv run research-mcp --version
      - name: research-mcp setup --print
        run: uv run research-mcp setup --print
      - name: rmcp --help
        run: uv run rmcp --help

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build and validate the Claude Desktop bundle
        run: uv run --no-project python mcpb/build.py --out dist
